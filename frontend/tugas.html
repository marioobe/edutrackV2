<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Tugas - EduTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/tugas.css">
  <script src="auth-check.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-primary shadow fixed-top" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-graduation-cap me-2"></i>EduTrack</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="taskmanager.html">Task Manager</a></li>
          <li class="nav-item"><a class="nav-link active" href="tugas.html">Tugas</a></li>
          <li class="nav-item"><a class="nav-link" href="jadwal.html">Jadwal</a></li>
          <li class="nav-item"><a class="nav-link" href="nilai.html">Nilai</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profil</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span id="navUserName" class="text-white fw-semibold"></span>
          <button id="btnLogout" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-4" style="margin-top:88px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0 fw-bold"><i class="fas fa-list-check me-2 text-primary"></i>Manajemen Tugas</h4>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal" id="btnTambahTugas"><i class="fas fa-plus me-1"></i>Tambah Tugas</button>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-xl-3 col-md-6">
        <div class="card stat-card p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="text-muted small fw-semibold">Total Tugas</div>
              <div class="fs-3 fw-bold text-dark" id="totalTasks">0</div>
            </div>
            <div class="bg-primary bg-opacity-10 p-3 rounded"><i class="fas fa-tasks text-primary fs-4"></i></div>
          </div>
        </div>
      </div>
      <div class="col-xl-3 col-md-6">
        <div class="card stat-card p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="text-muted small fw-semibold">Selesai</div>
              <div class="fs-3 fw-bold text-success" id="doneTasks">0</div>
            </div>
            <div class="bg-success bg-opacity-10 p-3 rounded"><i class="fas fa-check-circle text-success fs-4"></i></div>
          </div>
        </div>
      </div>
      <div class="col-xl-3 col-md-6">
        <div class="card stat-card p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="text-muted small fw-semibold">Belum Selesai</div>
              <div class="fs-3 fw-bold text-warning" id="pendingTasks">0</div>
            </div>
            <div class="bg-warning bg-opacity-10 p-3 rounded"><i class="fas fa-clock text-warning fs-4"></i></div>
          </div>
        </div>
      </div>
      <div class="col-xl-3 col-md-6">
        <div class="card stat-card p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="text-muted small fw-semibold">Progress</div>
              <div class="fs-3 fw-bold text-primary" id="progressPercent">0%</div>
            </div>
            <div class="progress-ring" id="progressRing" style="background: conic-gradient(#0d6efd 0deg, #e9ecef 0deg); width: 56px; height: 56px; font-size: 0;">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header bg-white">
            <div class="d-flex flex-wrap align-items-center gap-2">
              <span class="fw-bold me-2"><i class="fas fa-filter me-1"></i>Filter</span>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <select class="form-select form-select-sm" id="filterStatus" style="width:auto;">
                  <option value="semua">Semua Status</option>
                  <option value="belum">Belum Selesai</option>
                  <option value="selesai">Selesai</option>
                  <option value="lewat">Lewat Deadline</option>
                </select>
                <select class="form-select form-select-sm" id="filterPriority" style="width:auto;">
                  <option value="">Semua Prioritas</option>
                  <option value="tinggi">Tinggi</option>
                  <option value="sedang">Sedang</option>
                  <option value="rendah">Rendah</option>
                </select>
                <select class="form-select form-select-sm" id="filterMatkul" style="width:auto;">
                  <option value="">Semua Mata Kuliah</option>
                </select>
              </div>
            </div>
          </div>
          <div id="taskListContainer" style="max-height: 600px; overflow-y: auto;">
            <div class="text-center text-muted py-5" id="taskListLoading"><i class="fas fa-spinner fa-spin me-2"></i>Memuat tugas...</div>
            <div id="taskList"></div>
          </div>
        </div>
      </div>
      <div class="col-md-4" id="matkulSection">
        <div class="card mb-3">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-book me-1"></i>Mata Kuliah</span>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#matkulModal"><i class="fas fa-plus"></i></button>
          </div>
          <div class="card-body p-3" id="matkulList" style="max-height:200px;overflow-y:auto;">
            <div class="text-muted text-center py-3 small">Memuat...</div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><i class="fas fa-chart-pie me-1"></i>Progress per Mata Kuliah</div>
          <div class="card-body p-3" id="matkulProgress" style="max-height:300px;overflow-y:auto;">
            <div class="text-muted text-center py-3 small">Memuat...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="matkulModal" tabindex="-1">
    <div class="modal-dialog modal-sm"><div class="modal-content">
      <div class="modal-header"><h6 class="modal-title"><i class="fas fa-book me-1"></i>Tambah Mata Kuliah</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="matkulForm">
        <div class="modal-body">
          <div class="mb-2"><input type="text" class="form-control" id="matkulName" placeholder="Nama mata kuliah" required></div>
          <div id="matkulError" class="text-danger small d-none"></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary btn-sm w-100"><i class="fas fa-save me-1"></i>Simpan</button></div>
      </form>
    </div></div>
  </div>

  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h6 class="modal-title" id="taskModalTitle"><i class="fas fa-plus me-1"></i>Tambah Tugas</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="taskForm">
        <div class="modal-body">
          <input type="hidden" id="taskId">
          <div class="mb-3"><label class="form-label small fw-semibold">Judul Tugas</label><input type="text" class="form-control" id="taskTitle" placeholder="Masukkan judul tugas" required></div>
          <div class="mb-3"><label class="form-label small fw-semibold">Mata Kuliah</label><select class="form-select" id="taskMatkul"><option value="">-- Pilih Mata Kuliah --</option></select></div>
          <div class="row g-2 mb-3">
            <div class="col"><label class="form-label small fw-semibold">Prioritas</label><select class="form-select" id="taskPriority"><option value="sedang">Sedang</option><option value="tinggi">Tinggi</option><option value="rendah">Rendah</option></select></div>
            <div class="col"><label class="form-label small fw-semibold">Deadline</label><input type="date" class="form-control" id="taskDeadline"></div>
          </div>
          <div id="taskError" class="text-danger small d-none"></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary w-100" id="taskSubmitBtn"><i class="fas fa-save me-1"></i>Simpan</button></div>
      </form>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/tugas.js"></script>
</body>
</html>
