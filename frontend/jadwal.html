<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Kuliah - EduTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/jadwal.css">
  <script src="auth-check.js"></script>
</head>
<body class="bg-light">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-dark shadow fixed-top" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-graduation-cap me-2"></i>EduTrack</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="taskmanager.html">Task Manager</a></li>
          <li class="nav-item"><a class="nav-link" href="tugas.html">Tugas</a></li>
          <li class="nav-item"><a class="nav-link active" href="jadwal.html">Jadwal</a></li>
          <li class="nav-item"><a class="nav-link" href="nilai.html">Nilai</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profil</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span id="navUserName" class="text-white fw-semibold"></span>
          <button id="btnLogout" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container py-4" style="margin-top:88px;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h4 class="fw-bold mb-1">Jadwal Kuliah</h4>
        <p class="text-muted mb-0">Atur dan lihat jadwal perkuliahanmu.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTambahJadwal">
        <i class="fas fa-plus me-1"></i>Tambah Jadwal
      </button>
    </div>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm summary-card">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="feature-icon icon-tugas" style="width:48px;height:48px;font-size:1.2rem;"><i class="fas fa-book"></i></div>
            <div>
              <small class="text-muted">Total Mata Kuliah</small>
              <h4 class="fw-bold mb-0" id="totalMatkul">0</h4>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm summary-card">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="feature-icon icon-jadwal" style="width:48px;height:48px;font-size:1.2rem;"><i class="fas fa-clock"></i></div>
            <div>
              <small class="text-muted">Jam Per Minggu</small>
              <h4 class="fw-bold mb-0" id="totalJam">0</h4>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm summary-card">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="feature-icon icon-nilai" style="width:48px;height:48px;font-size:1.2rem;"><i class="fas fa-layer-group"></i></div>
            <div>
              <small class="text-muted">Jenis Jadwal</small>
              <h4 class="fw-bold mb-0"><span class="badge badge-kuliah me-1">K</span><span class="badge badge-praktikum me-1">P</span><span class="badge badge-bimbingan">B</span></h4>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div class="d-flex gap-3 mb-3 small">
      <span><span class="badge badge-kuliah px-2 py-1 rounded-pill"><i class="fas fa-circle me-1" style="color:#0d6efd;font-size:0.5rem;"></i>Kuliah</span></span>
      <span><span class="badge badge-praktikum px-2 py-1 rounded-pill"><i class="fas fa-circle me-1" style="color:#6f42c1;font-size:0.5rem;"></i>Praktikum</span></span>
      <span><span class="badge badge-bimbingan px-2 py-1 rounded-pill"><i class="fas fa-circle me-1" style="color:#fd7e14;font-size:0.5rem;"></i>Bimbingan</span></span>
    </div>

    <!-- Calendar Grid (Desktop) -->
    <div class="card border-0 shadow-sm d-none d-md-block mb-4">
      <div class="card-body p-3">
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </div>

    <!-- Mobile List View -->
    <div class="d-md-none mb-4" id="mobileJadwalList">
      <div id="mobileListContainer"></div>
    </div>
  </div>

  <!-- Modal Tambah Jadwal -->
  <div class="modal fade" id="modalTambahJadwal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="fas fa-plus me-2"></i>Tambah Jadwal</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="jadwalAlert"></div>
          <form id="formTambahJadwal">
            <div class="mb-3">
              <label class="form-label">Mata Kuliah</label>
              <input type="text" class="form-control" id="jMatkul" placeholder="Nama mata kuliah" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Jenis</label>
              <select class="form-select" id="jJenis" required>
                <option value="">Pilih jenis</option>
                <option value="kuliah">Kuliah</option>
                <option value="praktikum">Praktikum</option>
                <option value="bimbingan">Bimbingan</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Hari</label>
              <select class="form-select" id="jHari" required>
                <option value="">Pilih hari</option>
                <option value="Senin">Senin</option>
                <option value="Selasa">Selasa</option>
                <option value="Rabu">Rabu</option>
                <option value="Kamis">Kamis</option>
                <option value="Jumat">Jumat</option>
                <option value="Sabtu">Sabtu</option>
              </select>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">Jam Mulai</label>
                <input type="time" class="form-control" id="jMulai" required>
              </div>
              <div class="col-6">
                <label class="form-label">Jam Selesai</label>
                <input type="time" class="form-control" id="jSelesai" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Ruang</label>
              <input type="text" class="form-control" id="jRuang" placeholder="Nama ruangan" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary" id="btnSimpanJadwal"><i class="fas fa-save me-1"></i>Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Edit Jadwal -->
  <div class="modal fade" id="modalEditJadwal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning text-dark">
          <h5 class="modal-title"><i class="fas fa-edit me-2"></i>Edit Jadwal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="editJadwalAlert"></div>
          <form id="formEditJadwal">
            <input type="hidden" id="editJadwalId">
            <div class="mb-3">
              <label class="form-label">Mata Kuliah</label>
              <input type="text" class="form-control" id="eMatkul" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Jenis</label>
              <select class="form-select" id="eJenis" required>
                <option value="kuliah">Kuliah</option>
                <option value="praktikum">Praktikum</option>
                <option value="bimbingan">Bimbingan</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Hari</label>
              <select class="form-select" id="eHari" required>
                <option value="Senin">Senin</option>
                <option value="Selasa">Selasa</option>
                <option value="Rabu">Rabu</option>
                <option value="Kamis">Kamis</option>
                <option value="Jumat">Jumat</option>
                <option value="Sabtu">Sabtu</option>
              </select>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">Jam Mulai</label>
                <input type="time" class="form-control" id="eMulai" required>
              </div>
              <div class="col-6">
                <label class="form-label">Jam Selesai</label>
                <input type="time" class="form-control" id="eSelesai" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Ruang</label>
              <input type="text" class="form-control" id="eRuang" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-warning" id="btnSimpanEditJadwal"><i class="fas fa-save me-1"></i>Simpan Perubahan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/jadwal.js"></script>
</body>
</html>
