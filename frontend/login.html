<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EduTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow" style="width:100%;max-width:420px;">
      <div class="card-body p-4">
        <div id="expiredBanner" class="alert alert-warning d-none text-center py-2 small mb-3">Sesi Anda telah berakhir. Silakan login kembali.</div>
        <h3 class="text-center mb-4">Masuk</h3>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Password" required>
          </div>
          <div id="errorMsg" class="text-danger small d-none mb-3"></div>
          <button type="submit" class="btn btn-primary w-100" id="btnLogin">Masuk</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Belum punya akun? <a href="register.html">Daftar di sini</a>
        </p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
