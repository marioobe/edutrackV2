<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcast Newsletter - EduTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="auth-check.js"></script>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-primary shadow fixed-top" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-graduation-cap me-2"></i>EduTrack</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="taskmanager.html">Task Manager</a></li>
          <li class="nav-item"><a class="nav-link" href="tugas.html">Tugas</a></li>
          <li class="nav-item"><a class="nav-link" href="jadwal.html">Jadwal</a></li>
          <li class="nav-item"><a class="nav-link" href="nilai.html">Nilai</a></li>
          <li class="nav-item"><a class="nav-link active" href="broadcast.html">Broadcast</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profil</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span id="navUserName" class="text-white fw-semibold"></span>
          <button id="btnLogout" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-4" style="margin-top:88px;">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-3">
            <h5 class="mb-0"><i class="fas fa-bullhorn me-2 text-primary"></i>Kirim Newsletter</h5>
          </div>
          <div class="card-body p-4">
            <div id="alertBox" class="alert d-none"></div>
            <form id="broadcastForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Subject</label>
                <input type="text" class="form-control" id="subject" placeholder="Judul email" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Pesan <small class="text-muted">(HTML supported)</small></label>
                <textarea class="form-control" id="message" rows="10" placeholder="Tulis konten newsletter di sini..." required></textarea>
              </div>
              <div class="d-flex align-items-center gap-2">
                <button type="submit" class="btn btn-primary" id="btnSend">
                  <i class="fas fa-paper-plane me-1"></i><span>Kirim ke Semua Subscriber</span>
                </button>
                <span class="text-muted small" id="subscriberCount"></span>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 mb-3">
          <div class="card-header bg-white py-3">
            <h6 class="mb-0"><i class="fas fa-users me-2 text-primary"></i>Subscriber</h6>
          </div>
          <div class="card-body p-0">
            <div id="subscriberList" style="max-height:300px;overflow-y:auto;">
              <div class="text-muted text-center py-4 small">Memuat...</div>
            </div>
          </div>
        </div>
        <div class="card shadow-sm border-0">
          <div class="card-body p-3">
            <h6 class="fw-bold mb-2"><i class="fas fa-info-circle me-1 text-primary"></i>Catatan</h6>
            <ul class="small text-muted mb-0 ps-3">
              <li>Pastikan SMTP sudah dikonfigurasi di <code>.env</code></li>
              <li>Gunakan Gmail App Password untuk keamanan</li>
              <li>Pesan dikirim via BCC ke semua subscriber</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/broadcast.js"></script>
</body>
</html>
